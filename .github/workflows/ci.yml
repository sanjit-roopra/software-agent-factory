name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync development environment
        run: uv sync --locked --no-build --no-default-groups --group quality

      - name: Check formatting
        run: uv run --no-sync --no-build ruff format --check .

      - name: Lint
        run: uv run --no-sync --no-build ruff check --output-format=github .

      - name: Type check
        run: uv run --no-sync --no-build mypy src/software_agent_factory scripts/docs scripts/release scripts/performance/runtime_ab.py

  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync development environment
        run: uv sync --locked --no-build --no-default-groups --group test

      - name: Test with branch coverage
        if: matrix.python-version == '3.13'
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          uv run --no-sync --no-build pytest -q \
            --cov=src/software_agent_factory \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Test latest stable Python
        if: matrix.python-version != '3.13'
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: uv run --no-sync --no-build pytest -q

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync development environment
        run: uv sync --locked --no-build --no-default-groups --group distribution --group native

      - name: Build and validate wheel and sdist
        run: |
          uv build --no-sources
          uv run --no-sync --no-build twine check dist/*
          uv run --no-sync --no-build check-wheel-contents dist/*.whl

      - name: Smoke installed distributions in clean virtualenvs
        run: |
          set -euo pipefail
          VERSION=$(PYTHONPATH=src uv run --no-sync --no-build python - <<'PY'
          from software_agent_factory.version import get_version
          print(get_version())
          PY
          )
          uv run --no-sync --no-build python -m venv packaging/venvs/wheel-smoke
          packaging/venvs/wheel-smoke/bin/pip install dist/*.whl
          packaging/venvs/wheel-smoke/bin/python scripts/release/smoke_factory.py \
            --factory-executable packaging/venvs/wheel-smoke/bin/factory \
            --workspace-root packaging/wheel-smoke \
            --expect-version "$VERSION"
          uv run --no-sync --no-build python -m venv packaging/venvs/sdist-smoke
          packaging/venvs/sdist-smoke/bin/pip install dist/*.tar.gz
          packaging/venvs/sdist-smoke/bin/python scripts/release/smoke_factory.py \
            --factory-executable packaging/venvs/sdist-smoke/bin/factory \
            --workspace-root packaging/sdist-smoke \
            --expect-version "$VERSION"

      - name: Build and smoke portable frozen executable
        run: |
          set -euo pipefail
          BUILD_INFO=src/software_agent_factory/build-info.json
          trap 'rm -f "$BUILD_INFO"' EXIT
          VERSION=$(PYTHONPATH=src uv run --no-sync --no-build python - <<'PY'
          from software_agent_factory.version import get_version
          print(get_version())
          PY
          )
          PYTHON_VERSION=$(uv run --no-sync --no-build python - <<'PY'
          import platform
          print(platform.python_version())
          PY
          )
          PYINSTALLER_VERSION=$(uv run --no-sync --no-build python - <<'PY'
          import PyInstaller
          print(PyInstaller.__version__)
          PY
          )
          PYTHONPATH=src uv run --no-sync --no-build python scripts/release/generate_build_info.py \
            --output "$BUILD_INFO" \
            --tag "ci-${GITHUB_SHA:-smoke}" \
            --commit-sha "${GITHUB_SHA:-HEAD}" \
            --runner-image "${ImageOS:-unknown}" \
            --python-version "$PYTHON_VERSION" \
            --pyinstaller-version "$PYINSTALLER_VERSION" \
            --target-architecture "x86_64"
          uv run --no-sync --no-build pyinstaller --clean --noconfirm \
            --distpath packaging/dist/portable \
            --workpath packaging/build/portable \
            packaging/pyinstaller.spec
          uv run --no-sync --no-build python scripts/release/smoke_factory.py \
            --factory-executable packaging/dist/portable/software-agent-factory/factory \
            --workspace-root packaging/frozen-smoke/portable \
            --expect-version "$VERSION"

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build documentation
        run: |
          uv sync --locked --no-build --no-default-groups --group docs
          uv run --no-sync --no-build mkdocs build --strict
          uv run --no-sync --no-build python scripts/docs/check_simple_english.py
          uv run --no-sync --no-build python scripts/docs/check_rendered_links.py site

  sonar-new-issues:
    name: sonar-new-issues
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    env:
      PROJECT_KEY: sanjit-roopra_software-agent-factory
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # See ADR-028: the built-in "Sonar way" gate passes a PR that adds
      # issues while ratings stay at A, and the free plan cannot assign a
      # custom gate. This job enforces zero open issues on every PR.
      - name: Wait for SonarCloud to analyse the PR head commit
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            analysed_sha=$(curl -fsS --max-time 30 --get \
              "https://sonarcloud.io/api/project_pull_requests/list" \
              --data-urlencode "project=$PROJECT_KEY" \
              | jq -r --arg pr "$PR_NUMBER" \
                '.pullRequests[] | select(.key == $pr) | .commit.sha // empty') \
              || analysed_sha=""
            echo "SonarCloud analysed commit: ${analysed_sha:-none}, want $HEAD_SHA"
            if [ "$analysed_sha" = "$HEAD_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::SonarCloud did not analyse $HEAD_SHA for PR #$PR_NUMBER in time"
          exit 1

      - name: Require zero open SonarCloud issues on this PR
        run: |
          set -euo pipefail
          response=$(curl -fsS --max-time 30 --get "https://sonarcloud.io/api/issues/search" \
            --data-urlencode "componentKeys=$PROJECT_KEY" \
            --data-urlencode "pullRequest=$PR_NUMBER" \
            --data-urlencode "issueStatuses=OPEN,CONFIRMED" \
            --data-urlencode "ps=100")
          total=$(printf '%s' "$response" | jq -e '.paging.total')
          if ! [[ "$total" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected SonarCloud response: paging.total=$total"
            exit 1
          fi
          # Escape Sonar-supplied text so a crafted path or message cannot
          # inject a workflow command.
          printf '%s' "$response" | jq -r '
            def data: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def prop: data | gsub(":"; "%3A") | gsub(","; "%2C");
            .issues[]
            | "::error file=\(.component | sub("^[^:]*:"; "") | prop),line=\(.line // 1)::\(.rule | data) \(.message | data)"'
          if [ "$total" -ne 0 ]; then
            echo "::error::SonarCloud reports $total open issue(s) on PR #$PR_NUMBER"
            exit 1
          fi
          echo "SonarCloud reports 0 open issues on PR #$PR_NUMBER"

  ci-gate:
    name: ci-gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality
      - tests
      - package
      - docs
      - sonar-new-issues
    steps:
      - name: Require all gating checks
        env:
          SONAR_RESULT: ${{ needs.sonar-new-issues.result }}
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
          test "${{ needs.docs.result }}" = "success"
          # sonar-new-issues runs on pull requests only. Every ref except
          # main must pass it, so a manual run on a PR branch cannot post a
          # green ci-gate that skips SonarCloud.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            test "$SONAR_RESULT" = "success"
          fi

  macos-arm64:
    name: macos-arm64
    runs-on: macos-15
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # PRs rely on the required Ubuntu jobs; native arm64 packaging smoke runs
      # on main and manual dispatches to control hosted-runner cost.
      - name: Run packaging-focused tests
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          uv sync --locked --no-build --no-default-groups --group native --group test
          uv run --no-sync --no-build pytest -q \
            tests/test_cli.py \
            tests/test_cli_operations.py \
            tests/test_doctor.py \
            tests/test_service_install.py \
            tests/test_dashboard.py \
            tests/test_version.py \
            tests/test_release_workflows.py

      - name: Build and smoke the archived native frozen executable
        run: |
          set -euo pipefail
          BUILD_INFO=src/software_agent_factory/build-info.json
          trap 'rm -f "$BUILD_INFO"' EXIT
          VERSION=$(PYTHONPATH=src uv run --no-sync --no-build python - <<'PY'
          from software_agent_factory.version import get_version
          print(get_version())
          PY
          )
          PYTHON_VERSION=$(uv run --no-sync --no-build python - <<'PY'
          import platform
          print(platform.python_version())
          PY
          )
          PYINSTALLER_VERSION=$(uv run --no-sync --no-build python - <<'PY'
          import PyInstaller
          print(PyInstaller.__version__)
          PY
          )
          PYTHONPATH=src uv run --no-sync --no-build python scripts/release/generate_build_info.py \
            --output "$BUILD_INFO" \
            --tag "ci-$GITHUB_SHA" \
            --commit-sha "$GITHUB_SHA" \
            --runner-image "${ImageOS:-unknown}" \
            --python-version "$PYTHON_VERSION" \
            --pyinstaller-version "$PYINSTALLER_VERSION" \
            --target-architecture "arm64"
          uv run --no-sync --no-build pyinstaller --clean --noconfirm \
            --distpath packaging/dist/arm64 \
            --workpath packaging/build/arm64 \
            packaging/pyinstaller.spec
          uv run --no-sync --no-build python scripts/release/prepare_frozen_bundle.py \
            --bundle-dir packaging/dist/arm64/software-agent-factory \
            --version "$VERSION" \
            --architecture "arm64"
          ARCHIVE=packaging/artifacts/software-agent-factory-${VERSION}-macos-arm64.tar.gz
          mkdir -p packaging/artifacts
          COPYFILE_DISABLE=1 tar -C packaging/dist/arm64 -czf "$ARCHIVE" software-agent-factory
          uv run --no-sync --no-build python scripts/release/smoke_factory.py \
            --archive "$ARCHIVE" \
            --workspace-root packaging/frozen-smoke/arm64 \
            --expect-architecture "arm64" \
            --expect-version "$VERSION"

  macos-x86_64:
    name: macos-x86_64
    runs-on: macos-15-intel
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # PRs rely on the required Ubuntu jobs; native x86_64 packaging smoke runs
      # on main and manual dispatches to control hosted-runner cost.
      - name: Run packaging-focused tests
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          uv sync --locked --no-build --no-default-groups --group native --group test
          uv run --no-sync --no-build pytest -q \
            tests/test_cli.py \
            tests/test_cli_operations.py \
            tests/test_doctor.py \
            tests/test_service_install.py \
            tests/test_dashboard.py \
            tests/test_version.py \
            tests/test_release_workflows.py

      - name: Build and smoke the archived native frozen executable
        run: |
          set -euo pipefail
          BUILD_INFO=src/software_agent_factory/build-info.json
          trap 'rm -f "$BUILD_INFO"' EXIT
          VERSION=$(PYTHONPATH=src uv run --no-sync --no-build python - <<'PY'
          from software_agent_factory.version import get_version
          print(get_version())
          PY
          )
          PYTHON_VERSION=$(uv run --no-sync --no-build python - <<'PY'
          import platform
          print(platform.python_version())
          PY
          )
          PYINSTALLER_VERSION=$(uv run --no-sync --no-build python - <<'PY'
          import PyInstaller
          print(PyInstaller.__version__)
          PY
          )
          PYTHONPATH=src uv run --no-sync --no-build python scripts/release/generate_build_info.py \
            --output "$BUILD_INFO" \
            --tag "ci-$GITHUB_SHA" \
            --commit-sha "$GITHUB_SHA" \
            --runner-image "${ImageOS:-unknown}" \
            --python-version "$PYTHON_VERSION" \
            --pyinstaller-version "$PYINSTALLER_VERSION" \
            --target-architecture "x86_64"
          uv run --no-sync --no-build pyinstaller --clean --noconfirm \
            --distpath packaging/dist/x86_64 \
            --workpath packaging/build/x86_64 \
            packaging/pyinstaller.spec
          uv run --no-sync --no-build python scripts/release/prepare_frozen_bundle.py \
            --bundle-dir packaging/dist/x86_64/software-agent-factory \
            --version "$VERSION" \
            --architecture "x86_64"
          ARCHIVE=packaging/artifacts/software-agent-factory-${VERSION}-macos-x86_64.tar.gz
          mkdir -p packaging/artifacts
          COPYFILE_DISABLE=1 tar -C packaging/dist/x86_64 -czf "$ARCHIVE" software-agent-factory
          uv run --no-sync --no-build python scripts/release/smoke_factory.py \
            --archive "$ARCHIVE" \
            --workspace-root packaging/frozen-smoke/x86_64 \
            --expect-architecture "x86_64" \
            --expect-version "$VERSION"
