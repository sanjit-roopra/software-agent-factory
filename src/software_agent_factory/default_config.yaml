repository:
  branch_prefix: "factory/"
  command_timeout_seconds: 900
  commands:
    install: []
    verify: []
    build: []
  # Extra environment variable names repository commands may read. The
  # verifier always provides PATH, HOME, LANG and TERM and never inherits
  # credentials (GH_TOKEN, AWS_*, ...) implicitly.
  env_passthrough: []
  # Maximum stdout/stderr bytes retained (after redaction) per command.
  log_capture_bytes: 32768
  max_changed_files: 100
  protected_file_patterns:
    - ".env"
    - ".env.*"
    - "**/.env"
    - "**/.env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.p12"
    - "**/*.pfx"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "**/.npmrc"
    - "**/.netrc"
    - "**/.pypirc"
    - "**/.git-credentials"
    - "**/credentials.json"
    - "**/secrets.json"
    - "**/secrets.yaml"
    - "**/secrets.yml"
    - "**/.aws/**"
    - "**/.ssh/**"

routing:
  enabled: false
  api_url: "https://api.typesafe.ai/v1/systemone"
  model: "jev-1.13.0"
  api_key_env_var: "JEV_API_KEY"
  timeout_seconds: 5.0
  min_confidence: 0.7
  min_probability: 0.5
  max_prompt_chars: 4000
  max_response_bytes: 65536
  single_max_changed_files: 5
  rubric_version: "1.0"
  # Editable human policy of sensitive terms that disable short routes.
  # The factory does not treat governance categories as an intrinsic truth.
  # Matching terms in task text or labels disable short routes (SINGLE and CRITIQUE).
  # Matching terms still permit MANUAL_TRIAGE and FULL options.
  full_only_terms:
    - "auth"
    - "authentication"
    - "authorization"
    - "permission"
    - "permissions"
    - "encrypt"
    - "encryption"
    - "credential"
    - "credentials"
    - "secret"
    - "secrets"
    - "migration"
    - "migrations"
    - "deploy"
    - "deployment"
    - "production"
    - "prod"
    - "billing"
    - "payment"
    - "payments"
  options:
    - id: "single_l0"
      route: "SINGLE"
      complexity: "L0"
      risk: "R0"
      description: "Single-pass execution with L0 worker"
    - id: "single_l1"
      route: "SINGLE"
      complexity: "L1"
      risk: "R0"
      description: "Single-pass execution with L1 worker"
    - id: "critique_l1"
      route: "CRITIQUE"
      complexity: "L1"
      risk: "R1"
      description: "Execution with L1 worker and independent review"
    - id: "critique_l2"
      route: "CRITIQUE"
      complexity: "L2"
      risk: "R1"
      description: "Execution with L2 worker and independent review"
    - id: "full_l2"
      route: "FULL"
      complexity: "L2"
      description: "Full SDLC factory pipeline with L2 worker"
    - id: "full_l3"
      route: "FULL"
      complexity: "L3"
      description: "Full SDLC factory pipeline with L3 worker"
    - id: "manual_triage"
      route: "MANUAL_TRIAGE"
      description: "Escalate for human manual triage"

scope_drift:
  max_replans: 1
  # Exact files must also appear in the execution plan; no glob exemptions.
  approved_sensitive_files: []

review:
  # One initial review plus at most two review-driven repair rounds.
  max_rounds: 3
  # Low-risk runs may continue with bounded, explicitly recorded review debt.
  max_accepted_findings: 5
  accepted_risks: [R0, R1]
  blocked_categories: [SECURITY, SCOPE]

polish:
  enabled: true
  official_documentation_origins:
    - "https://docs.pytest.org"
    - "https://docs.python.org"
    - "https://nodejs.org"
    - "https://packaging.python.org"
    - "https://react.dev"
    - "https://testing-library.com"
    - "https://vite.dev"
    - "https://vitest.dev"
    - "https://www.typescriptlang.org"
  practice_reference_urls:
    - "https://raw.githubusercontent.com/bdfinst/agentic-dev-team/52cc5efd1c445e71c55b956837c003911346d7e7/plugins/dev-team/agents/a11y-review.md"
    - "https://raw.githubusercontent.com/bdfinst/agentic-dev-team/52cc5efd1c445e71c55b956837c003911346d7e7/plugins/dev-team/agents/component-architecture-review.md"
    - "https://raw.githubusercontent.com/bdfinst/agentic-dev-team/52cc5efd1c445e71c55b956837c003911346d7e7/plugins/dev-team/agents/js-fp-review.md"
    - "https://raw.githubusercontent.com/bdfinst/agentic-dev-team/52cc5efd1c445e71c55b956837c003911346d7e7/plugins/dev-team/agents/quality-reviewer.md"
    - "https://raw.githubusercontent.com/bdfinst/agentic-dev-team/52cc5efd1c445e71c55b956837c003911346d7e7/plugins/dev-team/agents/react-reactivity-review.md"
    - "https://raw.githubusercontent.com/bdfinst/agentic-dev-team/52cc5efd1c445e71c55b956837c003911346d7e7/plugins/dev-team/agents/refactor-opportunity-review.md"

performance:
  mode: "standard"
  fast_model_profile: "economy"

pull_request:
  enabled: false
  remote: "origin"
  base_branch: null
  draft: true
  allowed_hosts:
    - "github.com"

ci:
  enabled: false
  poll_interval_seconds: 30
  max_wait_seconds: 1800
  repair_attempts: 3

merge:
  enabled: false
  method: "squash"
  allowed_repositories: []
  required_checks: []

scheduler:
  enabled: false
  poll_interval_seconds: 30
  max_concurrent_tasks: 1
  stall_timeout_seconds: 900
  required_label: "agent-ready"
  # Safety bound on how many runs the local backlog daemon may claim per
  # UTC calendar day, independent of max_concurrent_tasks. Set to null for no
  # daily cap.
  max_runs_per_day: 20

escalation:
  enabled: false
  authorized_identities: []
  allowed_associations:
    - "OWNER"
    - "MEMBER"
    - "COLLABORATOR"
  max_reopens: 3
  reply_window_hours: 168
  max_reply_polls_per_tick: 10
  max_notification_attempts: 3
  allowed_hosts:
    - "github.com"

risk:
  R0:
    human_approval: false
  R1:
    human_approval: false
  R2:
    human_approval: true
  R3:
    human_approval: true
