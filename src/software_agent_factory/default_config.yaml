factory:
  data_dir: "~/.software-factory"
  agent_timeout_seconds: 900
  retries:
    same_model_attempts: 2
    max_total_attempts: 6

models:
  triage:
    model: "claude-sonnet-5"
    reasoning: "medium"
  refiner:
    model: "claude-opus-5"
    reasoning: "high"
  researcher:
    model: "gpt-5.6-sol"
    reasoning: "high"
  planner:
    model: "claude-opus-5"
    reasoning: "high"
  workers:
    L0:
      model: "mai-code-1.1-flash"
      reasoning: "medium"
    L1:
      model: "claude-sonnet-5"
      reasoning: "medium"
    L2:
      model: "claude-opus-5"
      reasoning: "high"
    L3:
      model: "claude-opus-5"
      reasoning: "high"
  tester:
    model: "claude-sonnet-5"
    reasoning: "high"
  reviewer:
    model: "gpt-5.6-sol"
    reasoning: "high"

repository:
  branch_prefix: "factory/"
  command_timeout_seconds: 900
  commands:
    install: []
    verify: []
    build: []
  # Extra environment variable names repository commands may read. The
  # verifier always provides PATH, HOME, LANG and TERM and never inherits
  # credentials (GH_TOKEN, AWS_*, ...) implicitly.
  env_passthrough: []
  # Maximum stdout/stderr bytes retained (after redaction) per command.
  log_capture_bytes: 32768
  max_changed_files: 100
  protected_file_patterns:
    - ".env"
    - ".env.*"
    - "**/.env"
    - "**/.env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.p12"
    - "**/*.pfx"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "**/.npmrc"
    - "**/.netrc"
    - "**/.pypirc"
    - "**/.git-credentials"
    - "**/credentials.json"
    - "**/secrets.json"
    - "**/secrets.yaml"
    - "**/secrets.yml"
    - "**/.aws/**"
    - "**/.ssh/**"

scope_drift:
  max_replans: 1

polish:
  enabled: true
  official_documentation_origins:
    - "https://docs.pytest.org"
    - "https://docs.python.org"
    - "https://nodejs.org"
    - "https://packaging.python.org"
    - "https://react.dev"
    - "https://testing-library.com"
    - "https://vite.dev"
    - "https://vitest.dev"
    - "https://www.typescriptlang.org"
  practice_reference_urls:
    - "https://raw.githubusercontent.com/bdfinst/agentic-dev-team/52cc5efd1c445e71c55b956837c003911346d7e7/plugins/dev-team/agents/a11y-review.md"
    - "https://raw.githubusercontent.com/bdfinst/agentic-dev-team/52cc5efd1c445e71c55b956837c003911346d7e7/plugins/dev-team/agents/component-architecture-review.md"
    - "https://raw.githubusercontent.com/bdfinst/agentic-dev-team/52cc5efd1c445e71c55b956837c003911346d7e7/plugins/dev-team/agents/js-fp-review.md"
    - "https://raw.githubusercontent.com/bdfinst/agentic-dev-team/52cc5efd1c445e71c55b956837c003911346d7e7/plugins/dev-team/agents/quality-reviewer.md"
    - "https://raw.githubusercontent.com/bdfinst/agentic-dev-team/52cc5efd1c445e71c55b956837c003911346d7e7/plugins/dev-team/agents/react-reactivity-review.md"
    - "https://raw.githubusercontent.com/bdfinst/agentic-dev-team/52cc5efd1c445e71c55b956837c003911346d7e7/plugins/dev-team/agents/refactor-opportunity-review.md"

pull_request:
  enabled: false
  remote: "origin"
  base_branch: null
  draft: true
  allowed_hosts:
    - "github.com"

ci:
  enabled: false
  poll_interval_seconds: 30
  max_wait_seconds: 1800
  repair_attempts: 3

scheduler:
  enabled: false
  poll_interval_seconds: 30
  max_concurrent_tasks: 1
  stall_timeout_seconds: 900
  required_label: "agent-ready"
  # Safety bound on how many runs the local backlog daemon may claim per
  # UTC calendar day, independent of max_concurrent_tasks. Set to null for no
  # daily cap.
  max_runs_per_day: 20

risk:
  R0:
    human_approval: false
  R1:
    human_approval: false
  R2:
    human_approval: true
  R3:
    human_approval: true
