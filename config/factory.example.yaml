factory:
  data_dir: "~/.software-factory"

  max_concurrent_tasks: 1

  retries:
    same_model_attempts: 2
    maximum_implementation_attempts: 4
    review_repair_attempts: 2
    ci_repair_attempts: 3

  polling:
    enabled: false
    interval_seconds: 30

  stall_timeout_seconds: 900

models:
  triage:
    model: "claude-sonnet-5"
    reasoning: "medium"

  refiner:
    model: "claude-opus-5"
    reasoning: "high"

  researcher:
    model: "gpt-5.6-sol"
    reasoning: "high"

  planner:
    model: "claude-opus-5"
    reasoning: "high"

  workers:
    L0:
      model: "mai-code-1.1-flash"
      reasoning: "medium"

    L1:
      model: "claude-sonnet-5"
      reasoning: "medium"

    L2:
      model: "claude-opus-5"
      reasoning: "high"

    L3:
      model: "claude-opus-5"
      reasoning: "high"

  tester:
    model: "claude-sonnet-5"
    reasoning: "high"

  reviewer:
    model: "gpt-5.6-sol"
    reasoning: "high"

  investigator:
    model: "claude-opus-5"
    reasoning: "high"

repository:
  default_branch: "main"
  branch_prefix: "factory/"

  commands:
    install: []
    verify: []
    build: []

github:
  create_pull_requests: false

  backlog:
    enabled: false
    required_label: "agent-ready"

risk:
  R0:
    human_approval: false

  R1:
    human_approval: false

  R2:
    human_approval: true

  R3:
    human_approval: true
