# Example factory configuration.
#
# This file mirrors src/software_agent_factory/default_config.yaml exactly:
# every section, key and value is identical, and tests assert that equality
# (tests/test_config.py). Copy it, edit it, and pass it explicitly:
#
#   factory run --repo ~/projects/example --title "..." --description "..." \
#     --config config/factory.example.yaml
#
# Every integration is opt-in and disabled here: pull_request.enabled,
# ci.enabled and scheduler.enabled are all false, so a run performs no network
# access and finishes at PR_READY. The loader is strict (extra="forbid"), so an
# unknown key is rejected rather than silently ignored.

factory:
  data_dir: "~/.software-factory"
  agent_timeout_seconds: 900
  # Set unattended to true so that no run stops for a person (ADR-039).
  unattended: false
  retries:
    same_model_attempts: 2
    max_total_attempts: 6

models:
  triage:
    model: "gpt-5.6-terra"
    reasoning: "medium"
    context_tier: "default"
  planner:
    model: "claude-opus-5"
    reasoning: "high"
    context_tier: "default"
  workers:
    L0:
      model: "mai-code-1.1-flash"
      reasoning: "medium"
      context_tier: "default"
    L1:
      model: "gemini-3.8-flash"
      reasoning: "high"
      context_tier: "default"
    L2:
      model: "claude-sonnet-5"
      reasoning: "high"
      context_tier: "default"
    L3:
      model: "claude-opus-5"
      reasoning: "high"
      context_tier: "default"
  tester:
    model: "gemini-3.8-flash"
    reasoning: "high"
    context_tier: "default"
  reviewer:
    model: "gpt-5.6-sol"
    reasoning: "high"
    context_tier: "default"

model_profiles:
  # For --runtime claude-code. Claude Code resolves the aliases to the
  # latest model; reasoning maps to --effort (low, medium, high, xhigh, max).
  # The reviewer family (opus) must differ from every worker family.
  claude:
    triage:
      model: "haiku"
      reasoning: "medium"
    planner:
      model: "opus"
      reasoning: "high"
    workers:
      L0:
        model: "haiku"
        reasoning: "medium"
      L1:
        model: "sonnet"
        reasoning: "medium"
      L2:
        model: "sonnet"
        reasoning: "high"
      L3:
        model: "sonnet"
        reasoning: "xhigh"
    tester:
      model: "sonnet"
      reasoning: "medium"
    reviewer:
      model: "opus"
      reasoning: "high"
  economy:
    triage:
      model: "gpt-5.6-luna"
      reasoning: "medium"
      context_tier: "default"
    planner:
      model: "gpt-5.6-terra"
      reasoning: "high"
      context_tier: "default"
    workers:
      L0:
        model: "mai-code-1.1-flash"
        reasoning: "medium"
        context_tier: "default"
      L1:
        model: "gemini-3.8-flash"
        reasoning: "high"
        context_tier: "default"
      L2:
        model: "gemini-3.8-flash"
        reasoning: "high"
        context_tier: "default"
      L3:
        model: "gemini-3.8-flash"
        reasoning: "high"
        context_tier: "default"
    tester:
      model: "gemini-3.8-flash"
      reasoning: "high"
      context_tier: "default"
    reviewer:
      model: "gpt-5.6-sol"
      reasoning: "high"
      context_tier: "default"

repository:
  branch_prefix: "factory/"
  command_timeout_seconds: 900
  commands:
    install: []
    verify: []
    build: []
  # With all command lists empty, derive commands from the repository's own
  # tools and keep those that pass on the base commit (ADR-034). This runs
  # repository code before triage. Set false for an untrusted repository.
  derive_commands: true
  # Run mutmut on changed Python modules after verification and list the
  # surviving mutants for review (ADR-034). Advisory: it never fails a run.
  mutation_gate: true
  # Extra environment variable names repository commands may read. The
  # verifier always provides PATH, HOME, LANG and TERM and never inherits
  # credentials (GH_TOKEN, AWS_*, ...) implicitly.
  env_passthrough: []
  # Maximum stdout/stderr bytes retained (after redaction) per command.
  log_capture_bytes: 32768
  max_changed_files: 100
  protected_file_patterns:
    - ".env"
    - ".env.*"
    - "**/.env"
    - "**/.env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.p12"
    - "**/*.pfx"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "**/.npmrc"
    - "**/.netrc"
    - "**/.pypirc"
    - "**/.git-credentials"
    - "**/credentials.json"
    - "**/secrets.json"
    - "**/secrets.yaml"
    - "**/secrets.yml"
    - "**/.aws/**"
    - "**/.ssh/**"

routing:
  enabled: false
  single_max_changed_files: 5
  rubric_version: "1.0"
  # Editable human policy of sensitive terms that disable short routes.
  # The factory does not treat governance categories as an intrinsic truth.
  # Matching terms in task text or labels disable short routes (SINGLE and CRITIQUE).
  # Matching terms still permit MANUAL_TRIAGE and FULL options.
  full_only_terms:
    - "auth"
    - "authentication"
    - "authorization"
    - "permission"
    - "permissions"
    - "encrypt"
    - "encryption"
    - "credential"
    - "credentials"
    - "secret"
    - "secrets"
    - "migration"
    - "migrations"
    - "deploy"
    - "deployment"
    - "production"
    - "prod"
    - "billing"
    - "payment"
    - "payments"
  options:
    - id: "single_l0"
      route: "SINGLE"
      complexity: "L0"
      risk: "R0"
      description: "Single-pass execution with L0 worker"
    - id: "single_l1"
      route: "SINGLE"
      complexity: "L1"
      risk: "R0"
      description: "Single-pass execution with L1 worker"
    - id: "critique_l1"
      route: "CRITIQUE"
      complexity: "L1"
      risk: "R1"
      description: "Execution with L1 worker and independent review"
    - id: "critique_l2"
      route: "CRITIQUE"
      complexity: "L2"
      risk: "R1"
      description: "Execution with L2 worker and independent review"
    - id: "full_l2"
      route: "FULL"
      complexity: "L2"
      description: "Full SDLC factory pipeline with L2 worker"
    - id: "full_l3"
      route: "FULL"
      complexity: "L3"
      description: "Full SDLC factory pipeline with L3 worker"
    - id: "manual_triage"
      route: "MANUAL_TRIAGE"
      description: "Escalate for human manual triage"

scope_drift:
  max_replans: 1
  # Exact files must also appear in the execution plan; no glob exemptions.
  approved_sensitive_files: []

review:
  # One initial review plus at most two review-driven repair rounds.
  max_rounds: 3
  # Low-risk runs may continue with bounded, explicitly recorded review debt.
  max_accepted_findings: 5
  accepted_risks: [R0, R1]
  blocked_categories: [SECURITY, SCOPE]

polish:
  # After deterministic verification first succeeds, one bounded worker pass
  # applies the fixed simplify and polish guidance and the review lenses for the
  # changed files, then the controller verifies everything again. No model
  # writes or selects this guidance.
  enabled: true

# factory start opens a setup pull request when the repository misses
# development tools (ADR-034). It needs pull_request.enabled. The factory
# never merges a setup pull request.
setup:
  enabled: true

pull_request:
  enabled: false
  remote: "origin"
  base_branch: null
  draft: true
  allowed_hosts:
    - "github.com"

ci:
  enabled: false
  poll_interval_seconds: 30
  max_wait_seconds: 1800
  repair_attempts: 3

merge:
  enabled: false
  method: "squash"
  allowed_repositories: []
  required_checks: []

scheduler:
  enabled: false
  poll_interval_seconds: 30
  max_concurrent_tasks: 1
  stall_timeout_seconds: 900
  required_label: "agent-ready"
  # Safety bound on how many runs the local backlog daemon may claim per
  # UTC calendar day, independent of max_concurrent_tasks. Set to null for no
  # daily cap.
  max_runs_per_day: 20

escalation:
  enabled: false
  authorized_identities: []
  allowed_associations:
    - "OWNER"
    - "MEMBER"
    - "COLLABORATOR"
  max_reopens: 3
  reply_window_hours: 168
  max_reply_polls_per_tick: 10
  max_notification_attempts: 3
  allowed_hosts:
    - "github.com"

risk:
  R0:
    human_approval: false
  R1:
    human_approval: false
  R2:
    human_approval: true
  R3:
    human_approval: true
